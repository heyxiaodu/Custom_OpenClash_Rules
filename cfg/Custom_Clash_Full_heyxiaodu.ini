;Custom_OpenClash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88
;本模板为 Full 模板，可以自由添加规则和分组，无性能考量，较为臃肿
;兼容 max_allowed_rulesets=64 的订阅转换后端，ruleset 条目总数须不超过 64
;
;=== heyxiaodu 个人化改造版（基于 main 分支 cfg/Custom_Clash_Full.ini 生成）===
;改造点 1：节点分组收敛为 🌟 美国精品 / 🇺🇸 美国节点 / 🇭🇰 香港节点 / 🇯🇵 日本节点 四档，按机场节点名正则匹配
;改造点 2：所有分组追加 .* 筛选，确保订阅 Provider 中的全部有效节点都能被选中
;改造点 3：规则文件统一使用 .yaml 格式，CDN 统一使用 testingcf.jsdelivr.net
;改造点 4：健康检查地址统一为 https://cp.cloudflare.com/generate_204
;改造点 5：新增 api.asailor.org 直连，避免 OpenClash 下载配置文件时代理超时
;说明：上游已于 2026-10 取消 google-cn 直连，本文件与上游保持一致，不再包含该规则
;注意：当前 ruleset 条目共 64 条，已达 max_allowed_rulesets=64 上限，后续新增规则需先精简同等数量
;
[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果
;解决 OpenClash 下载配置文件时代理超时的问题
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,api.asailor.org
;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,1800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
;各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
;Zoom 视频会议优先走代理，可在独立策略组切换直连
ruleset=📹 Zoom,[]GEOSITE,zoom
ruleset=📞 Talkatone,[]GEOSITE,talkatone
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🎧 Discord,[]GEOSITE,discord
;其余即时通讯域名由通用分组处理，专用规则须位于此分类之前
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=🤖 Grok,[]GEOSITE,xai
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=💾 OneDrive,[]GEOSITE,onedrive
ruleset=🤖 Copilot,[]GEOSITE,bing
ruleset=🤖 Claude,[]GEOSITE,anthropic
ruleset=🤖 Gemini,[]GEOSITE,google-gemini
